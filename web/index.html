<!doctype html>
<html>
  <head>
    <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
    <base href="$FLUTTER_BASE_HREF" />

    <meta charset="UTF-8" />
    <meta content="IE=Edge" http-equiv="X-UA-Compatible" />
    <meta name="description" content="Organiza y descubre deporte amateur en Perú. Únete a grupos, reserva tu lugar con tu saldo y juega cerca de ti." />

    <!-- Open Graph / Twitter -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="ProPlay" />
    <meta property="og:title" content="ProPlay - Encuentra tu próximo partido" />
    <meta property="og:description" content="Deporte amateur en Perú. Únete a grupos, reserva tu lugar con tu saldo y juega cerca de ti." />
    <meta property="og:url" content="https://proplayapp.com/" />
    <meta property="og:image" content="https://proplayapp.com/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://proplayapp.com/og-image.jpg" />

    <!-- iOS meta tags & icons -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="ProPlay" />
    <link rel="apple-touch-icon" href="icons/Icon-192.png" />

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="favicon.png" />

    <title>ProPlay - Encuentra tu próximo partido</title>
    <link rel="manifest" href="manifest.json" />

    <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyDD-9jkMn3n-JmNmSOvfO7gO2-HTkXIWQ4"></script>
  </head>
  <body style="margin:0;background:#0F1115;color:#F2F3F5;font-family:system-ui,sans-serif">
    <!-- Static homepage text for crawlers and Google's OAuth branding review
         (Flutter paints to a canvas). Removed once the app draws its first frame. -->
    <div id="static-home" style="max-width:640px;margin:0 auto;padding:48px 16px">
      <h1>ProPlay</h1>
      <p>ProPlay es una app para organizar y descubrir deporte amateur en Perú: fútbol, baloncesto y voleibol.
        Únete a grupos, reserva tu lugar en eventos con tu saldo y entra a la cancha con tu entrada QR.</p>
      <p>
        <a href="/events" style="color:#FF5A5C">Ver eventos</a> ·
        <a href="/login" style="color:#FF5A5C">Ingresar</a> ·
        <a href="/privacidad.html" style="color:#FF5A5C">Política de privacidad</a>
      </p>
    </div>
    <script>
      window.addEventListener('flutter-first-frame', function () {
        var el = document.getElementById('static-home');
        if (el) el.remove();
      });
    </script>
    <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
    <script>
      // Old hash links (/#/events/x) still open the right page now that the
      // app uses path URLs.
      if (location.hash.startsWith('#/')) {
        history.replaceState(null, '', location.hash.slice(1));
      }
    </script>
    <script src="flutter_bootstrap.js" async></script>
  </body>
</html>
