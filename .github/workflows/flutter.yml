name: Flutter

on:
  pull_request:
    paths:
      - "lib/**"
      - "test/**"
      - "web/**"
      - "assets/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - "analysis_options.yaml"
      - ".github/workflows/flutter.yml"
  push:
    branches: [main]
    paths:
      - "lib/**"
      - "test/**"
      - "web/**"
      - "assets/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - "analysis_options.yaml"
      - ".github/workflows/flutter.yml"

concurrency:
  group: flutter-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  flutter:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter --version

      - run: flutter pub get

      # `include_file_not_found` is a known warning while flutter_lints is
      # commented out in pubspec.yaml, so only errors fail the job.
      # Tighten to plain `flutter analyze` once flutter_lints is enabled.
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - run: flutter test --trace off

      # Compile check only. Deploys stay manual (see README).
      - run: flutter build web
